{% load static %}<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Факультет гуманітарних наук{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'faculty/style.css' %}">
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/">Факультет гуманітарних наук</a>
    <nav>
      <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Головна</a>
      <a href="/departments/" {% if '/departments/' in request.path %}class="active"{% endif %}>Кафедри</a>
      <a href="/programs/" {% if '/programs/' in request.path %}class="active"{% endif %}>Спеціальності</a>
      <a href="/exchange/" {% if '/exchange/' in request.path %}class="active"{% endif %}>Обмін</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>НаУКМА · Факультет гуманітарних наук</footer>
</body>
</html>
